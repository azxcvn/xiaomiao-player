name: media_kit
description: A cross-platform video player & audio player for Flutter & Dart. Performant, stable, feature-proof & modular.
homepage: https://github.com/media-kit/media-kit
repository: https://github.com/media-kit/media-kit
version: 1.2.6

topics:
  - video
  - video-player
  - audio
  - audio-player
  - cross-platform

environment:
  # 本地 fork：上游写作 ">=3.1.0 <4.0.0"，但代码里使用了 SDK 3.10 才有的 Web API
  # （lib/src/player/web/player/real.dart 的 web.URL.createObjectURL），
  # 导致 analyzer 报 `sdk_version_since`。此处把下界提到 3.10.0，使声明与代码一致。
  # 本应用 Dart SDK 为 3.12+，对依赖解析无影响。详见 FORK.md 补丁 4。
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  collection: ^1.17.0
  http: ">=0.13.0 <2.0.0"
  image: ^4.0.17
  meta: ^1.8.0
  path: ^1.8.0
  safe_local_storage: ^2.0.1
  synchronized: ^3.1.0
  universal_platform: ^1.0.0+1
  web: ^1.1.0
  uri_parser: ^3.0.1
  uuid: ">=2.0.0 <5.0.0"

dev_dependencies:
  test: ^1.24.1
  lints: ^5.0.0

ffigen:
  name: MPV
  output: bin/generated/libmpv/bindings.dart
  headers:
    entry-points:
      - headers/client.h
  dart-bool: true

flutter:
  assets:
    - assets/web/
